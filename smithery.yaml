# Smithery configuration for Cálculo de FGTS
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_calculo-fgts

name: calculo-fgts-mcp
displayName: "Cálculo de FGTS"
description: >
  **Cálculo de FGTS** para IA. Atualize valores de FGTS e diferenças com correção oficial e juros ao longo do período. Índices ao vivo de fontes públicas, sem login.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/calculo-fgts-mcp
repository: https://github.com/mcp-dir/calculo-fgts-mcp

tags:
  - juridico
  - legal
  - fgts
  - trabalhista
  - correcao-monetaria
  - brazil
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_calculo-fgts

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_calculo-fgts/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
